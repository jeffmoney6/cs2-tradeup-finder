name: Scanna trade-up-möjligheter

on:
  schedule:
    # Var 30:e minut, samma mönster som skinflip-tracker
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Kör scanning
        run: node scripts/run.js

      - name: Committa uppdaterat resultat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/opportunities.json
          git diff --staged --quiet || git commit -m "Uppdatera trade-up-möjligheter [skip ci]"
          git push
